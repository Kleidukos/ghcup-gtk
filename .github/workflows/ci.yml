name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  generate-matrix:
    name: 'Generate matrix from cabal'
    outputs:
      test-matrix: ${{ steps.set-test-matrix.outputs.matrix }}
      release-matrix: ${{ steps.extend-release-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract the tested GHC versions (tests)
        id: set-test-matrix
        uses: kleidukos/get-tested@v0.1.10.0
        with:
          cabal-file: ghcup-gtk.cabal
          ubuntu-version: '24.04,26.04'
          version: 0.1.10.0

      - name: Extract the tested GHC versions (packages)
        id: set-release-matrix
        uses: kleidukos/get-tested@v0.1.10.0
        with:
          cabal-file: ghcup-gtk.cabal
          ubuntu-version: '24.04,26.04'
          macos-version: 'latest'
          version: 0.1.10.0

      - name: Add the aarch64 Ubuntu runners to the release matrix
        id: extend-release-matrix
        env:
          MATRIX: ${{ steps.set-release-matrix.outputs.matrix }}
        run: |
          echo "matrix=$(jq -c '.include += [.include[] | select(.os | startswith("ubuntu-")) | .os += "-arm"]' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ matrix.ghc }} on ${{ matrix.os }}
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.test-matrix) }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}

    - name: Configure environment
      run: |
        sudo apt update
        sudo apt install -y \
          libadwaita-1-dev \
          libcairo2-dev \
          libfreetype-dev \
          libgdk-pixbuf-2.0-dev \
          libgirepository1.0-dev \
          libglib2.0-dev \
          libgraphene-1.0-dev \
          libgtk-4-dev \
          libharfbuzz-dev \
          liblzma-dev \
          libpango1.0-dev \
          zlib1g-dev
        echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
        echo "$HOME/.cabal/bin" >> $GITHUB_PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        cabal freeze

    - name: Cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/plan.json') }}
        restore-keys: ${{ runner.os }}-${{ matrix.ghc }}-

    - name: Build
      run: |
        make build

    - name: Test
      run: |
        cabal test

  packages:
    name: Packages with ${{ matrix.ghc }} on ${{ matrix.os }}
    if: github.event_name == 'push'
    needs: [generate-matrix, tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.release-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Configure environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libadwaita-1-dev \
            libcairo2-dev \
            libfreetype-dev \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libgraphene-1.0-dev \
            libgtk-4-dev \
            libharfbuzz-dev \
            liblzma-dev \
            libpango1.0-dev \
            zlib1g-dev \
            rpm \
            zstd \
            libarchive-tools \
            ruby-full \
            flatpak \
            flatpak-builder
          sudo gem install fpm
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          cabal update
          cabal freeze --project-file=cabal.release.project

      - name: Configure environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gtk4 libadwaita gobject-introspection pkgconf dylibbundler librsvg
          cabal update
          cabal freeze --project-file=cabal.release.project

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: release-${{ matrix.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/plan.json') }}
          restore-keys: release-${{ matrix.os }}-ghc-${{ matrix.ghc }}-

      - name: Cache flatpak runtimes
        if: startsWith(matrix.os, 'ubuntu-26.04')
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ runner.arch }}-${{ hashFiles('packaging/flatpak/org.haskell.GhcupGtk.yml') }}

      - name: Build packages
        run: |
          FORMATS=()
          case "${{ matrix.os }}" in
            ubuntu-26.04*) FORMATS=(deb rpm pacman flatpak tarball) ;;
            ubuntu-24.04*) FORMATS=(deb) ;;
          esac
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/package.sh -v "${GITHUB_REF_NAME#v}" ${FORMATS[@]+"${FORMATS[@]}"}
          else
            ./scripts/package.sh -v head ${FORMATS[@]+"${FORMATS[@]}"}
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ runner.arch }}
          path: dist-package/out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Sign packages
        uses: thomasdesr/minisign-action@68f9ff8e1074691a178b8ceb098d3d056aac54a3 # v1.4
        with:
          args: -Sm packages/*
          minisign_key: ${{ secrets.MINISIGN_SECRET_KEY }}
          password: ${{ secrets.MINISIGN_PASSWORD }}

      - name: Add public key to release assets
        run: cp release/ghcup-gtk-release.pub packages/

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            packages/*

      - name: Update rolling head release
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f ghcup-gtk-head
          git push -f origin ghcup-gtk-head
          gh release view ghcup-gtk-head >/dev/null 2>&1 || \
            gh release create ghcup-gtk-head \
              --prerelease \
              --title "ghcup-gtk-head" \
              --notes "Rolling build of the latest commit on main."
          gh release upload ghcup-gtk-head packages/* --clobber
